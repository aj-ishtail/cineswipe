name: Match watchlist

# Runs whenever one of the Letterboxd files changes, or by hand from the Actions tab.
on:
  push:
    branches: [main]
    paths: [watchlist.csv, ratings.csv, watched.csv, scripts/match.mjs]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: match
  cancel-in-progress: false

jobs:
  match:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Look up films on TMDB
        env:
          TMDB_TOKEN: ${{ secrets.TMDB_TOKEN }}
        run: node scripts/match.mjs
      - name: Save the results
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add movies.json
          [ -f scripts/seed-cache.json ] && git add scripts/seed-cache.json
          git diff --cached --quiet && echo "No changes" && exit 0
          git commit -m "Update matched films"
          git pull --rebase
          git push
