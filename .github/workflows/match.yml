name: Match watchlist

# Runs whenever watchlist.csv changes, or by hand from the Actions tab.
on:
  push:
    branches: [main]
    paths: [watchlist.csv]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: match
  cancel-in-progress: false

jobs:
  match:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Look up films on TMDB
        env:
          TMDB_TOKEN: ${{ secrets.TMDB_TOKEN }}
        run: node scripts/match.mjs
      - name: Save movies.json
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add movies.json
          git diff --cached --quiet && echo "No changes" && exit 0
          git commit -m "Update matched films"
          git push
